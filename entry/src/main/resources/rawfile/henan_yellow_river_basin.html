<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>河南黄河流域 · 互动地图</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden;
         font-family: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: transparent; color: #1C2C2A; -webkit-tap-highlight-color: transparent; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }

  /* ---------- 地图区：按 1600x915 比例占满宽度，不再留白 ---------- */
  #stage { position: relative; flex: 1; min-height: 0; width: 100%;
           overflow: hidden; cursor: grab; background: #E9EEF1; touch-action: none;
           user-select: none; overscroll-behavior: none; }
  #stage.drag { cursor: grabbing; }
  #world { position: absolute; left: 50%; top: 50%; transform-origin: 0 0;
           will-change: transform; backface-visibility: hidden; }
  #world svg { display: block; }
  #layer path, #layer rect, #layer text { pointer-events: none; }
  .hit { pointer-events: all; cursor: pointer; }
  .poi:hover .hit, .poi.active .hit { fill: rgba(52,125,115,.16); }
  .lbl { font-size: 28.5px; fill: #243447; paint-order: stroke; stroke: #FFF;
         stroke-width: 6px; stroke-linejoin: round;
         transform-box: fill-box; transform-origin: 50% 50%; transform: rotate(-90deg); }
  .lbl.省辖市 { font-size: 33px; font-weight: 700; }
  .lbl.县（市） { font-size: 25.5px; }
  .lbl.水利枢纽 { font-size: 25.5px; fill: #4A2A70; }
  .lbl.关键节点 { font-size: 27px; fill: #7A4F0E; font-weight: 700; }
  .lbl.trib { font-size: 25.5px; fill: #2C6E9B; font-style: italic; }
  .lbl.n, .lbl.sb { font-size: 24px; font-weight: 700; }

  /* ---------- 地图右下角控件 ---------- */
  #bar { position: absolute; right: 14px; bottom: 14px; z-index: 10;
         display: flex; flex-direction: column; gap: 22px; }
  #bar button { width: 114px; height: 114px; padding: 0; border: 2px solid #DCD6C8;
                border-radius: 57px; background: rgba(255,255,255,.95); color: #1C2C2A;
                font-size: 52px; font-weight: 600; line-height: 1; cursor: pointer;
                font-family: inherit; box-shadow: 0 4px 14px rgba(20,30,40,.18); }
  #bar button:active { background: #EFEAE0; }

  /* ---------- 经纬度提示 ---------- */
  #readout { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
             z-index: 9; max-width: calc(100% - 130px); opacity: 0; pointer-events: none;
             transition: opacity .18s ease; background: rgba(28,44,42,.82); color: #FFF;
             border-radius: 12px; padding: 7px 12px; font-size: 11px;
             font-variant-numeric: tabular-nums; }
  #readout.show { opacity: 1; }

  /* ---------- 地点弹窗（居中、固定大小） ---------- */
  #overlay { position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 29;
             display: none; background: rgba(24,32,30,.42); }
  #overlay.show { display: block; }
  #card { --mk: 2.25; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
          z-index: 30; display: none; flex-direction: column;
          width: 96%; max-width: 611px; height: 90%; max-height: 845px;
          background: #FFF; border-radius: 20px; padding: 24px 24px 14px;
          box-shadow: 0 18px 50px rgba(20,30,40,.30); }
  #card.show { display: flex; }
  #card .x { position: absolute; top: 14px; right: 18px; cursor: pointer; color: #A9B0AC;
             font-size: 24px; line-height: 1; }
  #card h3 { margin: 0 0 8px; font-size: calc(20px * var(--mk)); color: #1C2C2A;
             padding-right: 30px; display: flex; align-items: center; gap: 9px; }
  #card .tag { font-size: calc(12px * var(--mk)); color: #FFF; border-radius: 6px;
               padding: 3px 9px; font-weight: 400; flex: none; }
  #card .co { font-size: calc(13px * var(--mk)); color: #9AA29E; margin-bottom: 12px;
              font-variant-numeric: tabular-nums; }
  #card .txt { font-size: calc(15px * var(--mk)); line-height: 1.62; color: #4F5B57; }
  #card .body { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 16px;
                border-top: 1px solid #EFEAE0; padding-top: 12px; }
  #card .archive-head { display: flex; align-items: baseline; justify-content: space-between;
                        margin-bottom: 4px; color: #347D73;
                        font-size: calc(14px * var(--mk)); font-weight: 700; }
  #card .archive-head span { color: #9AA29E; font-size: calc(12px * var(--mk)); font-weight: 400; }
  #card .list { flex: 1; min-height: 0; overflow-y: auto; }
  #card .archive-item { display: flex; align-items: center; gap: 10px;
                        padding: 12px 2px; border-top: 1px solid #F2EEE5; cursor: pointer; }
  #card .archive-item:first-of-type { border-top: none; }
  #card .archive-item:active { background: #F3EFE6; }
  #card .archive-item .col { flex: 1; min-width: 0; }
  #card .archive-meta { color: #9AA29E; font-size: calc(12.5px * var(--mk)); }
  #card .archive-name { margin-top: 4px; color: #1C2C2A;
                        font-size: calc(17px * var(--mk)); font-weight: 700; }
  #card .archive-summary { margin-top: 4px; color: #55615C;
                           font-size: calc(13.5px * var(--mk)); line-height: 1.5; }
  #card .archive-item .go { flex: none; color: #C2C8C4; font-size: calc(16px * var(--mk)); }
  #card .empty-state { flex: 1; display: flex; flex-direction: column;
                       align-items: center; justify-content: center; text-align: center;
                       color: #A9B0AC; font-size: calc(15px * var(--mk)); line-height: 2.1; }

  /* ---------- 横屏 / 宽屏 ---------- */
  @media (orientation: landscape) and (min-width: 620px) {
    main { flex-direction: row; }
    #stage { width: 100%; height: 100%; }
  }
</style>
</head>

是黄河下游防洪与伊洛河供水的关键工程。"><circle class="hit" cx="550.0" cy="674.2" r="34" fill="transparent"/><path d="M 550.0 659.2 L 563.0 684.2 L 537.0 684.2 Z" fill="#6B3FA0" stroke="#FFF" stroke-width="2.5"/><text class="lbl 水利枢纽" x="564.0" y="662.2" text-anchor="start">陆浑水库</text></g>

<div id="overlay"></div>
<div id="card"></div>
<script>
const stage = document.getElementById('stage');
const world = document.getElementById('world');
const card = document.getElementById('card');
const overlay = document.getElementById('overlay');
const readout = document.getElementById('readout');

const VW = 1600, VH = 915;        // 原始经纬度映射用的画布尺寸
const RW = 915, RH = 1600;        // 旋转 90° 之后的画布尺寸
const WEST = 110.0, EAST = 116.4, SOUTH = 33.4, NORTH = 36.4;
const TAG = { '省辖市': '#D64545', '县（市）': '#E8845A', '水利枢纽': '#6B3FA0', '关键节点': '#E8A33D' };
const KIND_ORDER = ['省辖市', '县（市）', '水利枢纽', '关键节点'];

let scale = 1, tx = 0, ty = 0;
let archiveItems = [];
let dragFrame = 0, dragMoved = false;
let readoutTimer = 0;

const labelNodes = Array.prototype.slice.call(document.querySelectorAll('.lbl'));
const labelBase = labelNodes.map(function (el) {
  return parseFloat(getComputedStyle(el).fontSize) || 13;
});
// 每个标签的额外倍率：遗址条数 >= 4 的地点，名字要比普通标签订大一档（2 倍 vs 1.5 倍）
const labelMult = labelNodes.map(function () { return 1; });
const BIG_LABEL_MULT = 2 / 1.5;
const poiNodes = Array.prototype.slice.call(document.querySelectorAll('.poi'));
const hitNodes = Array.prototype.slice.call(document.querySelectorAll('.poi .hit'));
const tribNodes = Array.prototype.slice.call(document.querySelectorAll('.lbl.trib'));

// 层级：把所有地点（圆点 + 地名标签）统一移到最上层，保证地名压在河流名等其他文字之上
(function raisePoiLayer() {
  const rot = document.getElementById('rot');
  if (!rot) return;
  for (let i = 0; i < poiNodes.length; i++) {
    rot.appendChild(poiNodes[i]);
  }
})();

function renderTransform() {
  world.style.transform = 'translate3d(' + tx + 'px,' + ty + 'px,0) scale(' + scale + ')';
}

// 屏幕字号恒定：画布字号 = 目标屏幕字号 / 缩放；热点同理，避免缩小时点不中
function renderLabels() {
  // 字号跟随缩放放大：z=1 为初始视图，放大后字也变大（有上下限，保证可读）
  const z = scale / fitScale;
  for (let i = 0; i < labelNodes.length; i++) {
    const target = Math.min(Math.max(labelBase[i] * labelMult[i] * z * 0.9, 15), 72);
    labelNodes[i].style.fontSize = (target / scale) + 'px';
  }
  const screenR = Math.min(Math.max(22, 34 * scale), 60);
  const r = screenR / scale;
  for (let i = 0; i < hitNodes.length; i++) {
    hitNodes[i].setAttribute('r', r);
  }
}

// 文字层级：初始视图只显示省辖市；放大到 SHOW_MORE_Z 倍后才显示
// 县（市）、水利枢纽、关键节点以及河流名，避免小字挤在一起
const SHOW_MORE_Z = 1.45;

function applyVisibility() {
  const showMore = (scale / fitScale) >= SHOW_MORE_Z;
  for (let i = 0; i < poiNodes.length; i++) {
    const g = poiNodes[i];
    const keep = showMore || g.dataset.kind === '省辖市';
    g.style.display = keep ? '' : 'none';
  }
  for (let i = 0; i < tribNodes.length; i++) {
    tribNodes[i].style.display = showMore ? '' : 'none';
  }
}

function apply() {
  renderTransform();
  renderLabels();
  applyVisibility();
}

function scheduleTransform() {
  if (dragFrame) return;
  dragFrame = requestAnimationFrame(function () {
    dragFrame = 0;
    renderTransform();
  });
}

function flushTransform() {
  if (dragFrame) {
    cancelAnimationFrame(dragFrame);
    dragFrame = 0;
  }
  renderTransform();
}

let fitScale = 0.3;
function clampScale(s) { return Math.min(8, Math.max(fitScale, s)); }

function zoomAt(cx, cy, f) {
  // cx/cy 是相对舞台左上角的坐标；#world 原点在舞台中心，所以先换算成相对中心的偏移
  const r = stage.getBoundingClientRect();
  const ux = cx - r.width / 2, uy = cy - r.height / 2;
  const ns = clampScale(scale * f), k = ns / scale;
  tx = ux - k * (ux - tx); ty = uy - k * (uy - ty); scale = ns; apply();
}

function zoomBy(f) {
  const r = stage.getBoundingClientRect();
  zoomAt(r.width / 2, r.height / 2, f);
}

function fit() {
  const r = stage.getBoundingClientRect();
  // 竖版地图用铺满(cover)，避免上下或左右出现空白带
  fitScale = Math.max(r.width / RW, r.height / RH);
  scale = fitScale;
  tx = -RW * scale / 2; ty = -RH * scale / 2;
  apply();
}

function focusOn(lon, lat, target) {
  // #world 本身已定位在舞台中心，所以这里只需平移 -scale*坐标 即可把目标点放到中心
  scale = clampScale(target || Math.max(scale, 2.8));
  const x = (lon - WEST) / (EAST - WEST) * VW;
  const y = (NORTH - lat) / (NORTH - SOUTH) * VH;
  tx = -scale * (VH - y); ty = -scale * x;   // 旋转后的坐标
  apply();
}

function resetView() { fit(); hideCard(); }

function showReadout(text) {
  readout.textContent = text;
  readout.classList.add('show');
  if (readoutTimer) clearTimeout(readoutTimer);
  readoutTimer = setTimeout(function () {
    readout.classList.remove('show');
    readoutTimer = 0;
  }, 1800);
}

/* ---------------- 手势：单指平移 + 双指缩放 ---------------- */
const pointers = new Map();
let pinchDist = 0;

function stagePoint(e) {
  const r = stage.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function pointerList() { return Array.prototype.slice.call(pointers.values()); }
function distance(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}
function midpoint(a, b) {
  return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

stage.addEventListener('pointerdown', function (e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.target.closest('#bar')) return;
  pointers.set(e.pointerId, stagePoint(e));
  dragMoved = false;
  if (pointers.size === 1) {
    stage.classList.add('drag');
  } else if (pointers.size === 2) {
    const p = pointerList();
    pinchDist = distance(p[0], p[1]);
    stage.classList.remove('drag');
  }
  if (stage.setPointerCapture) {
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  }
  e.preventDefault();
}, { passive: false });

stage.addEventListener('pointermove', function (e) {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const cur = stagePoint(e);
  pointers.set(e.pointerId, cur);

  if (pointers.size >= 2) {
    const p = pointerList();
    const d = distance(p[0], p[1]);
    if (pinchDist > 0 && d > 0) {
      zoomAt(midpoint(p[0], p[1]).x, midpoint(p[0], p[1]).y, d / pinchDist);
      dragMoved = true;
    }
    pinchDist = d;
    e.preventDefault();
    return;
  }

  const dx = cur.x - prev.x, dy = cur.y - prev.y;
  if (!dragMoved && Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
  tx += dx; ty += dy;
  scheduleTransform();
  e.preventDefault();
}, { passive: false });

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  if (pointers.size === 0) {
    flushTransform();
    stage.classList.remove('drag');
  }
  if (stage.releasePointerCapture) {
    try { stage.releasePointerCapture(e.pointerId); } catch (err) {}
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

stage.addEventListener('wheel', function (e) {
  e.preventDefault();
  const p = stagePoint(e);
  zoomAt(p.x, p.y, e.deltaY < 0 ? 1.2 : 1 / 1.2);
}, { passive: false });

stage.addEventListener('click', function (e) {
  if (dragMoved) return;
  if (e.target.closest('.poi') || e.target.closest('#bar')) return;
  hideCard();
  const p = stagePoint(e);
  const r = stage.getBoundingClientRect();
  const rx = (p.x - r.width / 2 - tx) / scale, ry = (p.y - r.height / 2 - ty) / scale;
  const lon = WEST + ry / VW * (EAST - WEST);
  const lat = NORTH - (VH - rx) / VH * (NORTH - SOUTH);
  showReadout(lon.toFixed(3) + '°E  ' + lat.toFixed(3) + '°N');
});

/* ---------------- 详情抽屉 ---------------- */
function hideCard() {
  card.classList.remove('show');
  overlay.classList.remove('show');
  document.querySelectorAll('.poi.active').forEach(function (g) { g.classList.remove('active'); });
}

function normalizeText(value) {
  return String(value || '').replace(/\s+/g, '');
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function localArchiveItems(name) {
  const key = normalizeText(name);
  return archiveItems.filter(function (item) {
    const city = normalizeText(item.city);
    const searchable = normalizeText([
      item.title,
      item.summary,
      item.travel,
      (item.tags || []).join('')
    ].join(' '));
    return city === key || city.indexOf(key) >= 0 || key.indexOf(city) >= 0
      || searchable.indexOf(key) >= 0;
  });
}

function archiveSection(name) {
  const items = localArchiveItems(name);
  if (items.length === 0) {
    return '<div class="body"><div class="empty-state"><div>没有更多的啦~</div>'
      + '<div>看看别的地方吧！</div></div></div>';
  }
  let html = '<div class="body"><div class="archive-head">当地遗址 <span>'
    + items.length + ' 条</span></div><div class="list">';
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    html += '<div class="archive-item" data-id="' + escapeHtml(item.id) + '">'
      + '<div class="col"><div class="archive-meta">' + escapeHtml(item.era) + ' · '
      + escapeHtml(item.city) + ' · ' + escapeHtml(item.type) + '</div>'
      + '<div class="archive-name">' + escapeHtml(item.title) + '</div>'
      + '<div class="archive-summary">' + escapeHtml(item.summary) + '</div></div>'
      + '<span class="go">›</span></div>';
  }
  return html + '</div></div>';
}

function showCard(name) {
  const g = document.querySelector('.poi[data-name="' + name + '"]');
  if (!g) return;
  hideCard();
  card.dataset.name = name;
  g.classList.add('active');
  const kind = g.dataset.kind, lon = +g.dataset.lon, lat = +g.dataset.lat;
  card.innerHTML = '<span class="x">×</span>'
    + '<h3><span class="tag" style="background:' + TAG[kind] + '">' + kind + '</span>'
    + escapeHtml(name) + '</h3>'
    + '<div class="co">' + lon.toFixed(3) + '°E · ' + lat.toFixed(3) + '°N</div>'
    + '<div class="txt">' + escapeHtml(g.dataset.desc).split('\n').join('<br>') + '</div>'
    + archiveSection(name);
  card.querySelector('.x').onclick = hideCard;
  card.querySelectorAll('.archive-item').forEach(function (row) {
    row.addEventListener('click', function () {
      const id = row.dataset.id;
      if (window.archiveBridge && window.archiveBridge.openArchiveDetail) {
        window.archiveBridge.openArchiveDetail(id);
      }
      hideCard();
    });
  });
  card.classList.add('show');
  overlay.classList.add('show');
}

function refreshLabelMult() {
  for (let i = 0; i < labelNodes.length; i++) labelMult[i] = 1;
  for (let i = 0; i < poiNodes.length; i++) {
    const g = poiNodes[i];
    if (localArchiveItems(g.dataset.name).length < 4) continue;
    const lbl = g.querySelector('.lbl');
    const idx = lbl ? labelNodes.indexOf(lbl) : -1;
    if (idx >= 0) labelMult[idx] = BIG_LABEL_MULT;
  }
}

window.setArchiveData = function (items) {
  archiveItems = Array.isArray(items) ? items : [];
  refreshLabelMult();
  apply();
  if (card.classList.contains('show') && card.dataset.name) showCard(card.dataset.name);
};

poiNodes.forEach(function (g) {
  g.addEventListener('click', function (ev) {
    if (dragMoved) return;
    ev.stopPropagation();
    const name = g.dataset.name;
    if (g.classList.contains('active')) { hideCard(); return; }
    focusOn(+g.dataset.lon, +g.dataset.lat);
    showCard(name);
  });
});

document.getElementById('zoom-in').addEventListener('click', function () { zoomBy(1.5); });
document.getElementById('zoom-out').addEventListener('click', function () { zoomBy(1 / 1.5); });
document.getElementById('zoom-reset').addEventListener('click', resetView);
overlay.addEventListener('click', hideCard);

window.addEventListener('resize', fit);

fit();
</script>
</body>
</html>
